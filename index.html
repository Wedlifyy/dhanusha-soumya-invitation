<!-- ==========================================================
     RH:META — THE LINK PREVIEW.

     What WhatsApp, Facebook, Telegram and iMessage draw when this
     URL is pasted into a chat. None of those crawlers runs
     JavaScript, so these have to be plain text in the document —
     but they are NOT maintained here by hand. Every value below
     comes from `social` in data/wedding.config.js, and

         node tools/sync-meta.mjs <this folder>

     writes this block and manifest.webmanifest from it. Edit the
     config, run the script; never edit between the two markers.
     ========================================================== -->
<!-- RH:META:START -->
<title>Dhanusha MK &amp; Soumya — Wedding Invitation</title>

<body>

  <!-- Music sits top-right; language sits bottom-left, out of the
       artwork. Both appear only once the doors are open. -->
  <header class="hdr">
    <div data-c="musicButton"></div>
  </header>

  <!-- The invitation keeps a card's proportion on every screen. -->
  <main class="shell">
    <div data-c="hero"></div>
    <div data-c="coupleIntro"></div>
    <div data-c="dateReveal"></div>
    <div data-c="events"></div>
    <div data-c="gallery"></div>
    <div data-c="location"></div>
    <div data-c="rsvp"></div>
    <div data-c="blessing"></div>
    <div data-c="footer"></div>
  </main>

  <div class="dock">
    <div data-c="languageSwitch"></div>
  </div>

  <!-- Full-screen door overlay. -->
  <div data-c="splash"></div>

  <noscript>
    <div style="padding:40px 8%;text-align:center;font-family:Georgia,serif;color:#4E2E10">
      <p>Please turn on JavaScript to open this invitation.</p>
    </div>
  </noscript>

  <!-- Content first: both files are pure data and hold every
       wedding-specific string in the project. -->
  <script src="data/wedding.config.js"></script>
  <script src="data/content.i18n.js"></script>
  <!-- RH:LANGS:START -->
  <!-- RH:LANGS:END -->

  <script src="js/lib/state.js"></script>
  <!-- Writes the link-preview tags in the head from the same `social`
       block the sync tool reads, so the tab and the share sheet follow
       the language being read. -->
  <script src="js/lib/meta.js"></script>
  <script src="js/lib/reveal.js"></script>
  <script src="js/lib/motion.js"></script>
  <script src="js/lib/viewer.js"></script>
  <script src="js/lib/calendar.js"></script>

  <script src="js/components/splash.js"></script>
  <script src="js/components/music-button.js"></script>
  <script src="js/components/language-switch.js"></script>
  <script src="js/components/hero.js"></script>
  <script src="js/components/couple-intro.js"></script>
  <script src="js/components/date-reveal.js"></script>
  <script src="js/components/countdown.js"></script>
  <script src="js/components/events.js"></script>
  <script src="js/components/gallery.js"></script>
  <script src="js/components/location.js"></script>
  <script src="js/components/rsvp.js"></script>
  <script src="js/components/blessing.js"></script>
  <script src="js/components/footer.js"></script>

  <script src="js/app.js"></script>
</body>
